[project]
name = "dse-annotation-tool"
version = "0.2.0"
description = "Local causal DSE annotation and LeRobot v2.1 export"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4", "pyarrow==20.0.0", "av==16.0.1", "numpy==2.2.5", "pillow==11.2.1"]
[dependency-groups]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "ruff==0.11.9",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/dse_tool"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
